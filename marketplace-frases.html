<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Frases Marketplace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body { font-family: 'Inter', sans-serif; }

    /* Gradiente de fondo animado */
    .bg-app {
      background: #0a0f1e;
      background-image:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(59,130,246,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 110%, rgba(139,92,246,0.10) 0%, transparent 60%);
      min-height: 100vh;
    }

    /* Header glassmorphism */
    .header-glass {
      background: rgba(10, 15, 30, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(99, 102, 241, 0.15);
    }

    /* Tarjeta con borde sutil y hover */
    .card {
      background: rgba(15, 23, 42, 0.90);
      border: 1px solid rgba(99, 102, 241, 0.12);
      border-radius: 1.25rem;
      transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(135deg, rgba(99,102,241,0.04) 0%, transparent 60%);
      pointer-events: none;
    }
    .card:hover {
      border-color: rgba(99, 102, 241, 0.30);
      transform: translateY(-1px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 0 1px rgba(99,102,241,0.08);
    }

    /* Área de texto con gradiente de fondo */
    .text-area {
      background: rgba(2, 6, 23, 0.80);
      border: 1px solid rgba(99, 102, 241, 0.10);
      border-radius: 0.875rem;
      transition: border-color 0.2s;
    }
    .text-area:focus-within {
      border-color: rgba(99, 102, 241, 0.35);
    }

    /* Botón base */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      font-weight: 600;
      border-radius: 0.75rem;
      padding: 0.6rem 0.5rem;
      font-size: 0.72rem;
      cursor: pointer;
      transition: all 0.15s;
      user-select: none;
      -webkit-user-select: none;
    }
    .btn:active { transform: scale(0.94); }

    /* Variantes de botón */
    .btn-ghost {
      background: rgba(30, 41, 59, 0.80);
      border: 1px solid rgba(99, 102, 241, 0.12);
      color: #94a3b8;
    }
    .btn-ghost:hover { background: rgba(51, 65, 85, 0.90); color: #e2e8f0; border-color: rgba(99,102,241,0.25); }

    .btn-indigo {
      background: rgba(79, 70, 229, 0.18);
      border: 1px solid rgba(99, 102, 241, 0.30);
      color: #818cf8;
    }
    .btn-indigo:hover { background: rgba(79, 70, 229, 0.30); color: #a5b4fc; }

    .btn-copy {
      background: linear-gradient(135deg, #059669, #047857);
      border: 1px solid rgba(5, 150, 105, 0.40);
      color: #fff;
      box-shadow: 0 2px 8px rgba(5,150,105,0.25);
    }
    .btn-copy:hover { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 4px 16px rgba(5,150,105,0.35); }

    .btn-copy.copied {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border-color: rgba(37, 99, 235, 0.40);
      box-shadow: 0 2px 8px rgba(37,99,235,0.30);
    }

    /* Botón Variar Todo (header) */
    .btn-vary-all {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      border: 1px solid rgba(139,92,246,0.35);
      color: #fff;
      border-radius: 0.875rem;
      padding: 0.6rem 1rem;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      box-shadow: 0 4px 16px rgba(79,70,229,0.30);
      white-space: nowrap;
    }
    .btn-vary-all:hover { background: linear-gradient(135deg, #6366f1, #8b5cf6); box-shadow: 0 6px 20px rgba(79,70,229,0.45); }
    .btn-vary-all:active { transform: scale(0.95); }

    /* Badge de variante */
    .badge {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.12);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.20);
      transition: all 0.2s;
    }

    /* Número de categoría */
    .cat-number {
      width: 1.5rem;
      height: 1.5rem;
      border-radius: 0.4rem;
      background: rgba(79,70,229,0.18);
      border: 1px solid rgba(99,102,241,0.25);
      color: #818cf8;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      font-weight: 800;
      flex-shrink: 0;
    }

    /* Animación de flash al variar */
    @keyframes flash {
      0%   { opacity: 1; }
      30%  { opacity: 0.3; }
      100% { opacity: 1; }
    }
    .flash { animation: flash 0.25s ease; }

    /* Scroll suave en iOS */
    html { scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }

    /* Grid responsive para tarjetas */
    @media (min-width: 640px) {
      .cards-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    }
    @media (min-width: 1024px) {
      .cards-grid { grid-template-columns: 1fr 1fr 1fr; }
    }

    /* Separador decorativo entre secciones */
    .section-label {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #475569;
    }
  </style>
</head>

    // =========================================================================

    function inicializarUI() {
      let totalVariantes = 0;

      Object.keys(bancoMensajes).forEach(key => {
        estadoIndices[key] = 0;
        const item = bancoMensajes[key];
        totalVariantes += item.opciones.length;

        const contenedor = document.getElementById(`grupo-${item.grupo}`);
        if (!contenedor) return;

        const tarjeta = document.createElement('article');
        tarjeta.className = "card p-4 flex flex-col gap-3";
        tarjeta.id = `card-${key}`;
        tarjeta.innerHTML = `
          <!-- Encabezado de tarjeta -->
          <div class="flex items-center justify-between gap-2">
            <div class="flex items-center gap-2 min-w-0">
              <!-- Paso número -->
              <div class="flex-shrink-0 flex flex-col items-center justify-center w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-600/30 to-purple-600/20 border border-indigo-500/25">
                <span class="text-[8px] font-bold text-indigo-400 uppercase leading-none">Paso</span>
                <span class="text-sm font-extrabold text-indigo-300 leading-none">${item.num}</span>
              </div>
              <div class="min-w-0">
                <div class="w-5 h-5 text-base leading-none mb-0.5">${item.icono}</div>
                <span class="text-xs font-semibold text-slate-300 leading-tight block truncate">${item.titulo}</span>
              </div>
            </div>
            <span id="badge-${key}" class="badge flex-shrink-0">1 / ${item.opciones.length}</span>
          </div>

          <!-- Texto de la frase (clickeable para copiar) -->
          <div
            id="texto-${key}"
            class="text-area p-3.5 text-sm text-slate-100 leading-relaxed min-h-[60px] flex items-center cursor-pointer active:opacity-70 transition-opacity"
            onclick="copiarTextoDesdeArea('${key}', this)"
            title="Toca para copiar"
          >
            ${item.opciones[0]}
          </div>

          <!-- Acciones: solo Variar y Copiar -->
          <div class="grid grid-cols-2 gap-2">
            <button onclick="variarIndividual('${key}')" class="btn btn-indigo" title="Variante aleatoria">
              🎲 Variar
            </button>
            <button id="btn-copy-${key}" onclick="copiarTexto('${key}', this)" class="btn btn-copy">
              📋 Copiar
            </button>
          </div>
        `;
        contenedor.appendChild(tarjeta);
      });

      // Actualizar contador global
      const el = document.getElementById('total-variantes');
      if (el) el.textContent = `${totalVariantes} variantes`;
    }

      const idx  = estadoIndices[key];
      const textoEl = document.getElementById(`texto-${key}`);
      const badgeEl = document.getElementById(`badge-${key}`);

      textoEl.classList.add('flash');
      textoEl.addEventListener('animationend', () => textoEl.classList.remove('flash'), { once: true });

      textoEl.textContent = item.opciones[idx];
      badgeEl.textContent = `${idx + 1} / ${item.opciones.length}`;
    }

    function variarIndividual(key) {
      const total = bancoMensajes[key].opciones.length;
      let nuevo   = Math.floor(Math.random() * total);
      if (nuevo === estadoIndices[key]) nuevo = (estadoIndices[key] + 1) % total;
      estadoIndices[key] = nuevo;
      actualizarVista(key);
    }

    function variarTodoGeneral() {
      Object.keys(bancoMensajes).forEach(key => variarIndividual(key));
    }

    // Copia y luego varía automáticamente para la próxima vez
    function _ejecutarCopia(key, btnEl) {
      const texto = document.getElementById(`texto-${key}`).textContent.trim();
      navigator.clipboard.writeText(texto).then(() => {
        const original = btnEl.innerHTML;
        btnEl.innerHTML = "✅ Copiado";
        btnEl.classList.add('copied');
        setTimeout(() => {
          btnEl.innerHTML = original;
          btnEl.classList.remove('copied');
          variarIndividual(key); // rota automáticamente
        }, 900);
      }).catch(() => {
        // Fallback para navegadores sin permisos
        const r = document.createRange();
        const sel = window.getSelection();
        const el = document.getElementById(`texto-${key}`);
        r.selectNodeContents(el);
        sel.removeAllRanges();
        sel.addRange(r);
        document.execCommand('copy');
        sel.removeAllRanges();
      });
    }

    function copiarTexto(key, btnEl) { _ejecutarCopia(key, btnEl); }

    // Al tocar el área de texto también copia
    function copiarTextoDesdeArea(key, _areaEl) {
      const btnEl = document.getElementById(`btn-copy-${key}`);
      _ejecutarCopia(key, btnEl);
    }

    window.onload = inicializarUI;
  </script>
</body>
</html>
